<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-label="A luminous triangular organism inside a specimen ring">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B8FF5A" stop-opacity=".20"/>
      <stop offset=".48" stop-color="#63D6C5" stop-opacity=".06"/>
      <stop offset="1" stop-color="#080A09" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="460" height="460" fill="#080A09"/>
  <circle cx="230" cy="230" r="220" fill="url(#glow)"/>

  <g transform="translate(230 230)">
    <circle r="204" fill="none" stroke="#F1EEE3" stroke-opacity=".13"/>
    <circle r="194" fill="none" stroke="#B8FF5A" stroke-opacity=".42" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="1 14"/>
    <circle r="154" fill="none" stroke="#F1EEE3" stroke-opacity=".07" stroke-dasharray="2 10"/>

    <g fill="none" stroke="#F1EEE3" stroke-opacity=".16">
      <ellipse rx="140" ry="66" transform="rotate(-28)"/>
      <ellipse rx="140" ry="66" transform="rotate(32)"/>
    </g>

    <!-- the organism -->
    <polygon points="0,-100 88,58 -88,58" fill="#B8FF5A" fill-opacity=".055"
             stroke="#B8FF5A" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="0,-66 56,38 -56,38" fill="none"
             stroke="#F1EEE3" stroke-opacity=".14"/>

    <!-- its nervous system -->
    <g fill="none" stroke="#F1EEE3" stroke-opacity=".30" stroke-width="1.2">
      <path d="M0 -66L-24 -12L-56 38"/>
      <path d="M0 -66L30 -4L56 38"/>
      <path d="M-24 -12L30 -4"/>
      <path d="M-24 -12L-6 24"/>
      <path d="M30 -4L-6 24"/>
      <path d="M-6 24L-56 38M-6 24L56 38"/>
    </g>

    <g>
      <circle cx="0" cy="-66" r="4.6" fill="#B8FF5A"/>
      <circle cx="-24" cy="-12" r="3.8" fill="#B8FF5A"/>
      <circle cx="30" cy="-4" r="3.8" fill="#B8FF5A"/>
      <circle cx="-6" cy="24" r="4.2" fill="#F1EEE3"/>
      <circle cx="-56" cy="38" r="4.4" fill="#F0A45C"/>
      <circle cx="56" cy="38" r="4.4" fill="#F0A45C"/>
    </g>

    <circle cx="0" cy="-66" r="11" fill="none" stroke="#B8FF5A" stroke-opacity=".35">
      <animate attributeName="r" values="6;20" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".4;0" dur="4.8s" repeatCount="indefinite"/>
    </circle>

    <!-- drifting spore -->
    <circle cx="118" cy="-78" r="5" fill="#F0A45C"/>
    <circle cx="118" cy="-78" r="11" fill="#F0A45C" opacity=".10" filter="url(#soft)"/>
  </g>
</svg>
