<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 640px;
    background: #080A09;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  .plate { width: 1280px; display: block; }
  .foot {
    width: 1280px;
    padding: 0 40px;
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 2.6px;
    color: #8B968C;
  }
  .foot strong { color: #B8FF5A; font-weight: 400; }
</style>
</head>
<body>
  <img class="plate" src="banner-dark.svg" alt="">
  <div class="foot">
    <span><strong>github.com/dzdzdzdzdzdz213</strong></span>
    <span>ALGIERS / 36.7538° N / 3.0588° E</span>
  </div>
</body>
</html>
